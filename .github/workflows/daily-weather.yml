name: Daily weather log

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day — adjust to suit your timezone
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can push the updated CSV/chart

jobs:
  log-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch weather data
        run: python weather_logger.py

      - name: Score yesterday's prediction and forecast tomorrow
        run: python predict_temperature.py

      - name: Regenerate charts
        run: python generate_chart.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather_history.csv data/predictions.csv chart.png
          [ -f predictions.png ] && git add predictions.png
          git diff --staged --quiet || git commit -m "Daily weather update: $(date -u +'%Y-%m-%d')"
          git push
